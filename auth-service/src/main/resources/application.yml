server:
  port: 9991
spring:
  application:
    name:
      auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:60}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:120}
logging:
  level:
    org.flywaydb: DEBUG