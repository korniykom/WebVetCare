spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.39.27}:${DB_PORT:30532}/${DB_NAME:userdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9991/.well-known/jwks.json}

server:
  port: 9992