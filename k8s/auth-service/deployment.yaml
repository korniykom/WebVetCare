apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: auth-service
          image: ghcr.io/korniykom/webvetcare-auth-service:latest
          ports:
            - containerPort: 9991
          env:
            - name: DB_HOST
              value: auth-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: authdb
            - name: DB_USER
              value: postgres
            - name: DB_PASS
              value: postgres
            - name: JWT_PRIVATE_KEY_PATH
              value: /run/secrets/private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/secrets/public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: auth-jwt-keys