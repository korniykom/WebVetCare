apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webvetcare-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: webvetcare.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80